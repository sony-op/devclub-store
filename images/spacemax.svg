    <circle cx="152" cy="32" r="4" fill="#ef4444"/>
    <circle cx="164" cy="32" r="4" fill="#f59e0b"/>
    <circle cx="176" cy="32" r="4" fill="#10b981"/>
    
    <rect x="155" y="60" width="80" height="12" rx="3" fill="#2563eb"/>
    <rect x="155" y="80" width="170" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="155" y="92" width="140" height="6" rx="2" fill="#e2e8f0"/>

    <rect x="155" y="115" width="80" height="60" rx="6" fill="#3b82f6" opacity="0.15"/>
    <rect x="245" y="115" width="80" height="60" rx="6" fill="#3b82f6" opacity="0.15"/>

