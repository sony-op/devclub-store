<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="fubg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#fubg)"/>

  <!-- Left Mockup / Layout -->
  <g transform="translate(60, 45)">
    <rect x="0" y="20" width="160" height="230" rx="6" fill="#ffffff" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.35))"/>
    <rect x="15" y="40" width="80" height="12" rx="3" fill="#6d28d9"/>
    <rect x="15" y="60" width="130" height="6" rx="2" fill="#cbd5e1"/>
    
    <!-- Chair vector icon -->
    <rect x="15" y="85" width="130" height="80" rx="6" fill="#f5f3ff"/>
    <path d="M50 145 h60 v-30 a15 15 0 0 0 -15 -15 h-30 a15 15 0 0 0 -15 15 v30 z" fill="#8b5cf6"/>
    <line x1="60" y1="145" x2="55" y2="160" stroke="#6d28d9" stroke-width="3"/>
    <line x1="100" y1="145" x2="105" y2="160" stroke="#6d28d9" stroke-width="3"/>

    <text x="15" y="190" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#1e1b4b">Modern Lounge Chair</text>
    <text x="15" y="205" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#6d28d9">$149.00</text>
  </g>

  <!-- Center Mockup / Storefront -->
  <g transform="translate(240, 30)">
    <rect x="0" y="20" width="280" height="250" rx="8" fill="#ffffff" filter="drop-shadow(0 15px 35px rgba(0,0,0,0.4))"/>
    <rect x="0" y="20" width="280" height="28" rx="8" fill="#f8fafc"/>
    <text x="20" y="38" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#6d28d9">FUREA</text>
    <text x="75" y="38" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#64748b">Home  Shop  Blog  Contact</text>

    <!-- Hero banner in mockup -->
    <rect x="15" y="60" width="250" height="90" rx="6" fill="#f3e8ff"/>
    <text x="30" y="95" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#4c1d95">Minimalist Interior</text>
    <text x="30" y="115" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#7c3aed">UP TO 40% OFF THIS WEEK</text>
    
    <!-- 3 mini products -->
    <rect x="15" y="165" width="75" height="90" rx="4" fill="#faf5ff"/>
    <rect x="102" y="165" width="75" height="90" rx="4" fill="#faf5ff"/>
    <rect x="190" y="165" width="75" height="90" rx="4" fill="#faf5ff"/>
  </g>
</svg>
